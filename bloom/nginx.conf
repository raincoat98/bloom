server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # vite-plugin-pwa 가 생성하는 서비스워커 파일들
  location ~* \.(?:js|css|woff2|png|svg|ico|webmanifest)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA 라우팅 (History API) 폴백
  location / {
    try_files $uri $uri/ /index.html;
  }
}