# Cloudflare Tunnel 이 넘겨준 원래 프로토콜을 보존한다. 직접 접근(프록시 없음)이면 $scheme.
map $http_x_forwarded_proto $bloom_forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# API 는 같은 오리진으로 프록시한다. Cloudflare Tunnel 인그레스가 호스트네임 단위라
# bloom.cloudrainit.com 하나에 프론트와 API 가 함께 붙고, 그래서 VITE_API_URL 도
# 이 오리진을 가리킨다 (별도 API 도메인 · CORS 불필요).
upstream bloom_backend {
  server backend:3000;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 경로를 그대로 보존한다(접미사 없음) — 백엔드 라우트가 /api/*, /auth/* 다.
  location /api/ {
    proxy_pass http://bloom_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $bloom_forwarded_proto;
  }

  location /auth/ {
    proxy_pass http://bloom_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $bloom_forwarded_proto;
  }

  # 서비스워커와 앱 셸은 배포마다 다시 확인해야 한다
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # 파일명에 해시가 포함된 빌드 산출물만 장기 캐시
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* ^/workbox-[a-f0-9]+\.js$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:woff2|png|svg|ico)$ {
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # SPA 라우팅 (History API) 폴백
  location / {
    try_files $uri $uri/ /index.html;
  }
}