<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbf7"/>
      <stop offset="50%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fecdd3" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fffbf7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="markPetal" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="55%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f4584a" />
    </radialGradient>
    <radialGradient id="markCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fbbf24" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle decorative flower mark in background -->
  <g transform="translate(1000 315) scale(5.5)" opacity="0.12">
    <g fill="url(#markPetal)">
      <ellipse cx="0" cy="-16" rx="9" ry="15" />
      <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(60)" />
      <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(120)" />
      <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(180)" />
      <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(240)" />
      <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(300)" />
    </g>
    <circle r="6.5" fill="url(#markCore)" />
  </g>

  <!-- Content Container -->
  <g transform="translate(100 90)">
    <!-- Pill Badge -->
    <rect width="210" height="42" rx="21" fill="#ffffff" fill-opacity="0.9" stroke="#fecdd3" stroke-width="1.5"/>
    <g transform="translate(20 21) scale(0.38)">
      <g fill="url(#markPetal)">
        <ellipse cx="0" cy="-16" rx="9" ry="15" />
        <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(60)" />
        <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(120)" />
        <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(180)" />
        <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(240)" />
        <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(300)" />
      </g>
      <circle r="6.5" fill="url(#markCore)" />
    </g>
    <text x="44" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#be123c">나의 리듬을 부드럽게</text>

    <!-- Main Title with Icon -->
    <g transform="translate(0 120)">
      <g transform="translate(48 10) scale(1.4)">
        <g fill="url(#markPetal)">
          <ellipse cx="0" cy="-16" rx="9" ry="15" />
          <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(60)" />
          <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(120)" />
          <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(180)" />
          <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(240)" />
          <ellipse cx="0" cy="-16" rx="9" ry="15" transform="rotate(300)" />
        </g>
        <circle r="6.5" fill="url(#markCore)" />
      </g>
      <text x="110" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="76" font-weight="800" fill="#111827" letter-spacing="-1.5">Bloom</text>
    </g>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="34" font-weight="700" fill="#1f2937">
      나의 주기 다이어리: 생리 주기, 배란일, 가임기 계산기
    </text>

    <text x="0" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="22" font-weight="400" fill="#4b5563">
      마지막 생리일만 입력하면 다음 일정과 컨디션 흐름을 살며시 짚어드려요.
    </text>

    <!-- Feature Chips -->
    <g transform="translate(0 345)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="230" height="52" rx="16" fill="#ffffff" fill-opacity="0.95" stroke="#ffe4e6" stroke-width="1.5"/>
      <text x="24" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="17" font-weight="600" fill="#374151">🔒 계정 없이 로컬 보관</text>

      <!-- Chip 2 -->
      <rect x="246" y="0" width="220" height="52" rx="16" fill="#ffffff" fill-opacity="0.95" stroke="#ffe4e6" stroke-width="1.5"/>
      <text x="270" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="17" font-weight="600" fill="#374151">🌸 4단계 호르몬 케어</text>

      <!-- Chip 3 -->
      <rect x="482" y="0" width="200" height="52" rx="16" fill="#ffffff" fill-opacity="0.95" stroke="#ffe4e6" stroke-width="1.5"/>
      <text x="506" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="17" font-weight="600" fill="#374151">📱 가벼운 PWA 앱</text>
    </g>

    <!-- Footer URL -->
    <text x="0" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif" font-size="17" font-weight="600" fill="#9ca3af" letter-spacing="0.5">
      bloom.cloudrainit.com
    </text>
  </g>
</svg>
